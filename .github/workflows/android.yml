name: GoWeb Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Briefcase kur
        run: pip install briefcase

      - name: Android projesini oluştur
        run: briefcase create android --no-input

            - name: APK oluştur
        run: briefcase build android --no-input

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: GoWeb-Android-APK
          path: build/goweb/android/gradle/app/build/outputs/apk/debug/*.apk

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: GoWeb-Android-APK
          path: dist/*.apk